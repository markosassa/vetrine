<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · MP Personal Style</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/assets/base.css"><link rel="stylesheet" href="/mp-personalstyle/style.css"><style>.admin{max-width:900px;margin:0 auto;padding:24px}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--soft);text-align:left}.tbl th{color:var(--mut)}.act{display:flex;gap:8px}.btn-sm{padding:6px 12px;border-radius:8px;border:0;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}.btn-sm.alt{background:var(--soft);color:var(--fg)}.empty{padding:40px;text-align:center;color:var(--mut)}</style></head>
<body>
<header class="h"><a class="logo" href="index.html">MP Personal Style</a><span class="tel">Admin</span></header>
<main class="admin">
<h1>Prenotazioni</h1>
<div id="list" style="overflow-x:auto"></div>
</main>
<script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function load(){try{return JSON.parse(localStorage.getItem('prenotazioni')||'[]');}catch(e){return [];}}
function render(){
  const arr=load();
  const c=document.querySelector('#list');
  if(!arr.length){c.innerHTML='<div class="empty">Nessuna prenotazione.</div>';return;}
  let html='<table class="tbl"><thead><tr><th>Data</th><th>Cliente</th><th>Telefono</th><th>Servizi</th><th>Giorno/Ora</th><th>Azioni</th></tr></thead><tbody>';
  arr.forEach((b,i)=>{html+='<tr><td>'+esc(new Date(b.ts).toLocaleString('it-IT'))+'</td><td>'+esc(b.nome||'-')+'</td><td>'+esc(b.tel)+'</td><td>'+esc((b.servizi||[]).join(', '))+'</td><td>'+esc(b.giorno)+' '+esc(b.ora)+'</td><td class="act"><button class="btn-sm" onclick="notify('+i+')">Notifica</button><button class="btn-sm alt" onclick="del('+i+')">Elimina</button></td></tr>';});
  html+='</tbody></table>';
  c.innerHTML=html;
}
function notify(i){const b=load()[i];if(!b)return;alert('Notifica inviata a '+b.tel+': conferma prenotazione per '+b.giorno+' '+b.ora);}
function del(i){const arr=load();arr.splice(i,1);localStorage.setItem('prenotazioni',JSON.stringify(arr));render();}
render();
</script>
</body></html>
